services:
  - type: web
    name: news-pulse-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: news-pulse-db
    databaseName: news_pulse
    user: news_pulse_user
    plan: free
    region: oregon
